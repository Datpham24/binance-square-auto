name: Binance Square Auto Post (5x Daily Golden Hours)

on:
  schedule:
    # 5 Khung Giờ Vàng Việt Nam (UTC+7) - đặt lệch phút :00 cao điểm sang phút :07
    # để tránh nghẽn hàng đợi toàn cầu của GitHub Actions:
    # - 01:07 UTC = 08:07 sáng VN (Mở phiên sáng)
    # - 05:07 UTC = 12:07 trưa VN (Nghỉ trưa soi chart)
    # - 09:07 UTC = 16:07 chiều VN (Mở cửa Phiên Âu)
    # - 13:07 UTC = 20:07 tối VN (Trước giờ mở cửa Phiên Mỹ)
    # - 16:07 UTC = 23:07 đêm VN (Ca đêm Futures Phiên Mỹ)
    - cron: "7 1,5,9,13,16 * * *"
  workflow_dispatch:

jobs:
  auto-post-square:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run Auto Square Pro via Binance Square OpenAPI
        env:
          TZ: Asia/Ho_Chi_Minh
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: python auto_square_pro.py --openapi
